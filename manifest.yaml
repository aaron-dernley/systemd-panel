manifestVersion: 1
name: "@aaronge/systemd-panel"
version: "2026.08.27.2"
description: "Enable, disable, and inspect the status of any systemd unit through swamp — one typed, versioned model instance per unit, with enablement, activation, and last-run outcome (parsed from journalctl for timers, from systemctl show for services) all in one place. Not tied to any particular workload or hardware."

repository: https://github.com/aaron-dernley/systemd-panel

models:
  - systemd_unit.ts

additionalFiles:
  - README.md
  - LICENSE

binaries:
  - swamp-panel

platforms:
  - linux-x86_64
  - linux-aarch64

labels:
  - systemd
  - ops
  - monitoring
